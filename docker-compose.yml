services:
  web:
    image: node:24
    # Run as the host user (the image's `node` user is uid 1000), so npm install
    # and builds don't leave root-owned node_modules / dist behind.
    user: "1000:1000"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    working_dir: /app
    command: bash -c "npm install && npm run dev"
