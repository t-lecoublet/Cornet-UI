<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/logo.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cornet | Vue 3 component library for DaisyUI 5</title>
    <!-- Component count: keep in sync with `docsCounts` in src/data/docs/registry.ts -->
    <meta name="description" content="Cornet is a Vue 3 component library with 50 components built on DaisyUI 5 and Tailwind CSS 4. Fully typed with TypeScript, 35+ themes, free and open source.">
    <meta name="theme-color" content="#ffffff">
    <link rel="canonical" href="https://cornet-ui.com/">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cornet-ui.com/">
    <meta property="og:title" content="Cornet | Vue 3 component library for DaisyUI 5">
    <meta property="og:description" content="50 beautifully crafted Vue 3 components powered by DaisyUI 5 and Tailwind CSS 4. Fully typed, 35+ themes, free and open source.">
    <meta property="og:image" content="https://cornet-ui.com/logoLong.svg">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Cornet | Vue 3 component library for DaisyUI 5">
    <meta name="twitter:description" content="50 beautifully crafted Vue 3 components powered by DaisyUI 5 and Tailwind CSS 4.">

    <!-- LCP preload: le navigateur fetch le logo hero avant même que le JS se charge -->
    <link rel="preload" as="image" href="/logoLong.svg" fetchpriority="high">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <!-- Context7 docs chat: injected once the page has loaded and gone idle, so it stays off the critical path (FCP/LCP/TBT). -->
    <script>
      addEventListener('load', () => {
        const inject = () => {
          const s = document.createElement('script')
          s.src = 'https://context7.com/widget.js'
          s.dataset.library = '/git_gitlab_limos_fr/hub-isima_daisyui-vue-kit'
          // The theme's primary hue, darkened: the widget writes white on this colour, and #f09100 gives only 2.4:1.
          s.dataset.color = '#ad5e00'
          s.dataset.placeholder = 'Ask about Cornet…'
          s.dataset.welcomeMessage = 'Hi! Ask me anything about Cornet: components, props, theming or installation. Your questions are sent to Context7 to be answered.'
          document.body.appendChild(s)
        }
        'requestIdleCallback' in window ? requestIdleCallback(inject, { timeout: 3000 }) : setTimeout(inject, 1500)
      })
    </script>
  </body>
</html>
